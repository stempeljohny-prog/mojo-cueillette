/* LOCK */
#lockScreen{position:fixed;inset:0;background:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:18px}
#lockScreen h2{font-family:'DM Serif Display',serif;font-size:2.2rem;color:#fff;font-weight:400}
#lockScreen p{font-size:.85rem;color:rgba(255,255,255,.45);margin-top:-10px}
.pin-dots{display:flex;gap:16px}
.pin-dot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:transparent;transition:background .15s}
.pin-dot.filled{background:#fff;border-color:#fff}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:4px}
.pin-btn{width:72px;height:72px;border-radius:50%;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;font-family:'DM Sans',sans-serif;font-size:1.3rem;font-weight:500;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center}
.pin-btn:active{background:rgba(255,255,255,.22)}
.pin-error{color:#e74c3c;font-size:.82rem;min-height:20px;text-align:center}

/* APP */
header{background:var(--text);color:#fff;padding:14px 20px 10px;position:sticky;top:0;z-index:100;display:flex;align-items:center}
header h1{font-family:'DM Serif Display',serif;font-size:1.35rem;font-weight:400;flex:1}
.header-date{font-size:.72rem;color:rgba(255,255,255,.5)}
.sync-status{font-size:.68rem;padding:2px 8px;border-radius:10px;font-weight:500;margin-top:3px;white-space:nowrap}
.sync-status.ok{background:rgba(138,184,90,.25);color:#8ab85a}
.sync-status.syncing{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
.sync-status.error{background:rgba(192,57,43,.25);color:#e74c3c}
.tabs{background:var(--text);padding:0 16px 12px;position:relative}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.25);color:rgba(255,255,255,.65);font-size:.82rem;font-weight:500;cursor:pointer;background:transparent;transition:all .2s}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:16px;max-width:600px;margin:0 auto}

/* DATE TABS */
.date-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.date-tabs::-webkit-scrollbar{display:none}
.date-tab{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:.78rem;cursor:pointer;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:5px}
.date-tab.active{background:var(--text);border-color:var(--text);color:#fff}
.date-tab .del-date{font-size:.7rem;opacity:.6;padding:0 2px}
.date-tab-new{border-style:dashed;color:var(--accent);border-color:var(--accent2)}

/* BUDGET */
.budget-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.budget-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.budget-label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.8px}
.budget-amount{font-family:'DM Serif Display',serif;font-size:2rem}
.budget-amount span{font-size:1rem;color:var(--text2)}
.budget-set{display:flex;align-items:center;gap:6px}
.budget-set label{font-size:.78rem;color:var(--text2)}
.budget-set input{width:75px;padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.88rem;background:var(--bg);color:var(--text)}
.progress-bar{height:10px;background:var(--surface2);border-radius:10px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;border-radius:10px;transition:width .4s,background .3s;background:var(--accent)}
.progress-fill.warn{background:var(--warning)}
.progress-fill.over{background:var(--danger)}
.budget-sub{display:flex;justify-content:space-between;margin-top:6px;font-size:.78rem;color:var(--text2)}
.budget-remaining{font-weight:600}
.budget-remaining.over{color:var(--danger)}
.budget-remaining.warn{color:var(--warning)}
.budget-remaining.ok{color:var(--accent)}

/* SEARCH */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.search-bar input{flex:1;border:none;background:transparent;font-family:inherit;font-size:.9rem;color:var(--text)}
.search-bar input:focus{outline:none}
.section-title{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.section-title button{font-size:.75rem;color:var(--accent);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600}

/* FLOWER ROWS */
.flower-list{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.flower-row{background:var(--surface);border-radius:11px;padding:8px 10px;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow);border:1px solid var(--border);transition:border-color .2s}
.flower-row.has-qty{border-color:var(--accent2);background:#f7fbf3}
.flower-row.dragging{opacity:.35;background:var(--surface2)}
.flower-row.drag-over-h{border-color:var(--accent);border-style:dashed}
.harvest-handle{cursor:grab;color:#ccc;font-size:.9rem;padding:0 1px;touch-action:none;user-select:none;flex-shrink:0}
.flower-info{flex:1;min-width:0}
.flower-name{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flower-price{font-size:.75rem;color:var(--text2)}

/* QTY */
.qty-ctrl{display:flex;align-items:center;background:var(--surface2);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.qty-btn{width:28px;height:32px;border:none;background:transparent;font-size:1rem;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;user-select:none}
.qty-btn:active{background:var(--border)}
.qty-input{width:36px;height:32px;text-align:center;border:none;background:transparent;font-family:inherit;font-size:.88rem;font-weight:700;color:var(--text);padding:0;-moz-appearance:textfield;appearance:textfield}
.qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty-input:focus{outline:none;background:rgba(92,138,60,.08)}
.flower-subtotal{font-weight:700;font-size:.82rem;color:var(--accent);min-width:40px;text-align:right}
.flower-subtotal.zero{color:var(--border)}

/* FLORIST SELECTOR */
.florist-selector{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.florist-selector::-webkit-scrollbar{display:none}
.fs-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:.8rem;cursor:pointer;font-weight:500;transition:all .15s}
.fs-btn.active{background:var(--text);border-color:var(--text);color:#fff}
.fs-btn.has-qty-f{border-color:var(--accent);color:var(--accent);background:#f0f8ea}

/* RÉCAP */
.summary-florist{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--border);box-shadow:var(--shadow)}
.sf-name{font-family:'DM Serif Display',serif;font-size:1.05rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.sf-total{font-size:.85rem;color:var(--accent);font-weight:700;font-family:'DM Sans',sans-serif}
.sf-row{display:flex;justify-content:space-between;font-size:.82rem;padding:3px 0;color:var(--text2)}
.sf-row span:last-child{color:var(--text);font-weight:500}
.sf-budget-bar{height:6px;background:var(--surface2);border-radius:6px;margin-top:8px;overflow:hidden}
.sf-budget-fill{height:100%;border-radius:6px;background:var(--accent)}
.sf-budget-fill.warn{background:var(--warning)}
.sf-budget-fill.over{background:var(--danger)}

/* CATALOGUE */
.catalog-row{background:var(--surface);border-radius:9px;padding:9px 12px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);margin-bottom:5px;transition:background .15s}
.catalog-row input[type=text]{border:none;background:transparent;font-family:inherit;font-size:.88rem;color:var(--text);flex:1;min-width:0}
.catalog-row input[type=text]:focus{outline:none;border-bottom:1.5px solid var(--accent)}
.catalog-row input[type=number]{border:none;background:transparent;font-family:inherit;font-size:.88rem;font-weight:600;color:var(--accent);width:56px;text-align:right;-moz-appearance:textfield;appearance:textfield}
.catalog-row input[type=number]::-webkit-outer-spin-button,.catalog-row input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.del-btn{background:none;border:none;color:var(--danger);font-size:1rem;cursor:pointer;padding:4px;flex-shrink:0}

/* SELECTION par fleuriste dans Cueillette */
.flower-sel-row{background:var(--surface);border-radius:9px;padding:8px 12px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);margin-bottom:5px;transition:background .15s}
.flower-sel-row.selected{background:#f0f8ea;border-color:var(--accent2)}
.check-toggle{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.check-toggle.on{background:var(--accent);border-color:var(--accent);color:#fff;font-size:.85rem}

.add-row{display:flex;gap:7px;margin-top:10px}
.add-row input{flex:1;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:.86rem;background:var(--surface);color:var(--text)}
.add-row input:focus{outline:none;border-color:var(--accent)}
.btn-add{padding:9px 14px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:.86rem;font-weight:600;cursor:pointer;flex-shrink:0}
.florist-mgmt-row{background:var(--surface);border-radius:9px;padding:9px 12px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);margin-bottom:5px}
.florist-mgmt-row input{flex:1;border:none;background:transparent;font-family:inherit;font-size:.88rem;color:var(--text)}
.florist-mgmt-row input:focus{outline:none;border-bottom:1.5px solid var(--accent)}
.save-section{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid var(--border);box-shadow:var(--shadow)}
.save-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);margin-bottom:10px}
.btn-reset{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:11px;background:transparent;font-family:inherit;font-size:.86rem;color:var(--text2);cursor:pointer;margin-bottom:7px}
.btn-export{width:100%;padding:12px;border:none;border-radius:11px;background:var(--text);font-family:inherit;font-size:.86rem;color:#fff;font-weight:600;cursor:pointer;margin-bottom:7px}
.btn-import{width:100%;padding:12px;border:1.5px solid var(--accent);border-radius:11px;background:transparent;font-family:inherit;font-size:.86rem;color:var(--accent);font-weight:600;cursor:pointer;margin-bottom:7px}
.hint{font-size:.73rem;color:var(--text2);margin-bottom:10px;padding:8px 12px;background:var(--surface2);border-radius:8px;line-height:1.5}

/* MIX */
.mix-card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--border);box-shadow:var(--shadow)}
.mix-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.mix-row:last-child{border-bottom:none}
.mix-name{flex:1;font-size:.88rem;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mix-price{font-size:.75rem;color:var(--text2);white-space:nowrap}
.priority-btns{display:flex;gap:3px;flex-shrink:0}
.prio-btn{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--border);background:transparent;font-size:.7rem;cursor:pointer;font-weight:700;transition:all .15s;color:var(--text2)}
.prio-btn.active-1{background:#e3f2fd;border-color:#90caf9;color:#1565c0}
.prio-btn.active-2{background:#fff3e0;border-color:#ffb74d;color:#e65100}
.prio-btn.active-3{background:#fce4ec;border-color:#f48fb1;color:#c62828}
.mix-result-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:.86rem}
.mix-result-row:last-child{border-bottom:none}
.mix-qty-badge{background:var(--accent);color:#fff;border-radius:12px;padding:2px 10px;font-weight:700;font-size:.82rem}
.mix-total-bar{height:8px;background:var(--surface2);border-radius:8px;overflow:hidden;margin:10px 0 6px}
.mix-total-fill{height:100%;border-radius:8px;background:var(--accent);transition:width .4s}

/* COMMANDES */
.cmd-card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--border);box-shadow:var(--shadow)}
.cmd-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.cmd-fleuriste{font-family:'DM Serif Display',serif;font-size:1.1rem}
.cmd-entreprise{font-size:.78rem;color:var(--text2)}
.cmd-meta{font-size:.72rem;color:var(--text2);margin-top:2px}
.cmd-statut{font-size:.72rem;padding:3px 10px;border-radius:12px;font-weight:600;white-space:nowrap}
.cmd-statut.attente{background:#fff3e0;color:#e65100}
.cmd-statut.prep{background:#e3f2fd;color:#1565c0}
.cmd-statut.prete{background:#e8f5e9;color:#2e7d32}
.cmd-statut.terminee{background:#f3e5f5;color:#6a1b9a}
.cmd-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.cmd-line:last-child{border-bottom:none}
.cmd-line.done{opacity:.5}
.cmd-line.done .cmd-line-name{text-decoration:line-through}
.cmd-check{width:26px;height:26px;border-radius:7px;border:2px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:.9rem}
.cmd-check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cmd-line-info{flex:1;min-width:0}
.cmd-line-name{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-line-detail{font-size:.75rem;color:var(--text2)}
.cmd-line-sub{font-weight:700;font-size:.82rem;color:var(--accent);white-space:nowrap}
.cmd-progress{height:8px;background:var(--surface2);border-radius:8px;overflow:hidden;margin:10px 0 4px}
.cmd-progress-fill{height:100%;border-radius:8px;background:var(--accent);transition:width .4s}
.cmd-paste-area{width:100%;min-height:120px;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:.85rem;background:var(--surface);color:var(--text);resize:vertical}
.cmd-paste-area:focus{outline:none;border-color:var(--accent)}
.cmd-list-item{background:var(--surface);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s}
.cmd-list-item:active{border-color:var(--accent2)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:10px 20px;border-radius:20px;font-size:.84rem;transition:transform .3s;z-index:9998;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--text2);font-size:.88rem;padding:30px 0}

/* VARIANTS */
.flower-group{background:var(--surface);border-radius:11px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:7px;overflow:hidden;transition:border-color .2s}
.flower-group.has-qty{border-color:var(--accent2)}
.flower-group-header{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
.flower-group-header:active{background:var(--surface2)}
.group-toggle{font-size:.8rem;color:var(--text2);transition:transform .2s;flex-shrink:0}
.group-toggle.open{transform:rotate(90deg)}
.flower-group-variants{border-top:1px solid var(--border);background:var(--surface2)}
.variant-row{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 32px;border-bottom:1px solid var(--border)}
.variant-row:last-child{border-bottom:none}
.variant-name{flex:1;font-size:.85rem;color:var(--text2)}

/* DISPO TAB */
.dispo-row{background:var(--surface);border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:7px}
.dispo-row.has-dispo{border-color:#64b5f6;background:#f0f7ff}
.dispo-name{flex:1;font-size:.9rem;font-weight:600}
.dispo-badge{font-size:.72rem;padding:2px 8px;border-radius:10px;background:var(--surface2);color:var(--text2);margin-left:4px}
.dispo-badge.ok{background:#e3f2fd;color:#1565c0}
.dispo-qty-ctrl{display:flex;align-items:center;background:var(--surface2);border-radius:9px;overflow:hidden;border:1px solid var(--border)}

<body>

<!-- LOCK -->
<div id="lockScreen">
  <h2>🌸 Mojo</h2>
  <p>Code d'accès</p>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-error" id="pinError"></div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinPress('1')">1</button>
    <button class="pin-btn" onclick="pinPress('2')">2</button>
    <button class="pin-btn" onclick="pinPress('3')">3</button>
    <button class="pin-btn" onclick="pinPress('4')">4</button>
    <button class="pin-btn" onclick="pinPress('5')">5</button>
    <button class="pin-btn" onclick="pinPress('6')">6</button>
    <button class="pin-btn" onclick="pinPress('7')">7</button>
    <button class="pin-btn" onclick="pinPress('8')">8</button>
    <button class="pin-btn" onclick="pinPress('9')">9</button>
    <div></div>
    <button class="pin-btn" onclick="pinPress('0')">0</button>
    <button class="pin-btn" onclick="pinDel()">⌫</button>
  </div>
</div>

<script>
const PIN_CODE='1312',PIN_KEY='mojo_auth';
let pinEntry='';
function checkAuth(){if(localStorage.getItem(PIN_KEY)==='ok')document.getElementById('lockScreen').style.display='none';}
function pinPress(d){
  if(pinEntry.length>=4)return;
  pinEntry+=d;
  document.getElementById('d'+(pinEntry.length-1)).classList.add('filled');
  if(pinEntry.length===4){
    if(pinEntry===PIN_CODE){localStorage.setItem(PIN_KEY,'ok');document.getElementById('lockScreen').style.display='none';}
    else{document.getElementById('pinError').textContent='Code incorrect';setTimeout(()=>{pinEntry='';[0,1,2,3].forEach(i=>document.getElementById('d'+i).classList.remove('filled'));document.getElementById('pinError').textContent='';},900);}
  }
}
function pinDel(){if(!pinEntry.length)return;document.getElementById('d'+(pinEntry.length-1)).classList.remove('filled');pinEntry=pinEntry.slice(0,-1);}
checkAuth();
</script>

// ── CATALOGUE ─────────────────────────────────────────────────────────

function makeMojoFlowers(){
  return [...MOJO_BASE].sort((a,b)=>a.localeCompare(b,'fr')).map((name,i)=>({id:'f'+i,name,price:MOJO_PRICES[name]||0.60}));
}

const todayKey=()=>new Date().toISOString().slice(0,10);
const uid=()=>'x'+Math.random().toString(36).substr(2,8);

// ── STATE ─────────────────────────────────────────────────────────────
// Structure session :
// sessions[dateKey][floristId] = { selectedIds:[...], flowerOrder:[...], quantities:{flowerId: qty} }
function defaultState(){
  return {
    flowers: makeMojoFlowers(),   // catalogue global (sans active)
    florists: [{id:'c1',name:'Fleuriste 1',budget:100},{id:'c2',name:'Fleuriste 2',budget:100}],
    sessions: {},
    dispo: {}, // { dateKey: { flowerId: qty, variantId: qty } }
    activeSession: todayKey(),
    activeFlorist: 'c1',
    activeTab: 'harvest',
    harvestSubTab: 'cueillette', // 'cueillette' | 'selection'
    expandedGroups: {}, // { flowerId: bool } pour dérouler variantes
    mixPriorities: {}, // { flowerId: 1|2|3 }
    mixBudget: 100,
    mixFloristId: null,
    commandes: {}, // { cmdId: {...} }
    activeCommande: null,
    sechees: [], // [{id,name,pu,stock}] stock = nombre de bottes
    seaux: {stock:{procona:0,petit:0,carre:0}, mouvements:[]},
    _seauType: 'procona', // stock par type + mouvements:[{date,sens:'sortie'|'retour',type:'procona'|'petit'|'carre',qty,fleuriste}]

  };
}

let state=defaultState();
let saveTimer=null;

// ── FIREBASE ──────────────────────────────────────────────────────────
function setSyncStatus(s){
  const el=document.getElementById('syncStatus');if(!el)return;
  if(s==='ok'){el.textContent='✓ Synchronisé';el.className='sync-status ok';}
  else if(s==='syncing'){el.textContent='⟳ Synchro…';el.className='sync-status syncing';}
  else{el.textContent='⚠ Hors ligne';el.className='sync-status error';}
}
let _localWriteTime=0;
function pushToFirebase(){
  setSyncStatus('syncing');
  _localWriteTime=Date.now();
  set(ref(db,ROOT),{flowers:state.flowers,florists:state.florists,sessions:state.sessions,dispo:state.dispo||{},commandes:state.commandes||{},sechees:state.sechees||[],seaux:state.seaux||{stock:{procona:0,petit:0,carre:0},mouvements:[]}})
    .then(()=>setSyncStatus('ok')).catch(()=>setSyncStatus('error'));
}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(pushToFirebase,800);}

onValue(ref(db,ROOT),(snap)=>{
  try{
    const data=snap.val();
    if(!data){pushToFirebase();renderMain();return;}
    // Si c'est notre propre écriture récente (< 2s) ET que l'app est déjà affichée,
    // on ne re-render pas pour éviter de perdre le focus / scroll pendant la saisie
    const isOwnWrite=(Date.now()-_localWriteTime)<2000;
    if(isOwnWrite && _appRendered){
      setSyncStatus('ok');
      return;
    }
    // Mise à jour depuis un autre appareil
    if(data.flowers&&Array.isArray(data.flowers)) state.flowers=data.flowers;
    if(data.florists&&Array.isArray(data.florists)) state.florists=data.florists;
    if(data.sessions) state.sessions=sanitizeSessions(data.sessions);
    if(data.dispo) state.dispo=data.dispo;
    if(data.commandes) state.commandes=data.commandes;
    if(data.sechees&&Array.isArray(data.sechees)) state.sechees=data.sechees;
    if(data.seaux) state.seaux=data.seaux;
    setSyncStatus('ok');
    renderMain();
  }catch(e){console.error(e);setSyncStatus('error');}
},(err)=>{console.error(err);setSyncStatus('error');renderMain();});

function sanitizeSessions(sessions){
  const out={};
  Object.keys(sessions||{}).forEach(dk=>{
    out[dk]={};
    Object.keys(sessions[dk]||{}).forEach(fid=>{
      const fs=sessions[dk][fid]||{};
      out[dk][fid]={
        selectedIds: Array.isArray(fs.selectedIds)?fs.selectedIds:[],
        flowerOrder: Array.isArray(fs.flowerOrder)?fs.flowerOrder:[],
        quantities: fs.quantities||{},
        prices: fs.prices||{},
        dupes: fs.dupes||{},
      };
    });
  });
  return out;
}

// ── SESSION HELPERS ───────────────────────────────────────────────────
function getFloristSession(dateKey, floristId){
  if(!state.sessions[dateKey]) state.sessions[dateKey]={};
  if(!state.sessions[dateKey][floristId]){
    state.sessions[dateKey][floristId]={selectedIds:[],flowerOrder:[],quantities:{},prices:{}};
  }
  const fs=state.sessions[dateKey][floristId];
  if(!fs.selectedIds) fs.selectedIds=[];
  if(!fs.flowerOrder) fs.flowerOrder=[];
  if(!fs.quantities) fs.quantities={};
  if(!fs.prices) fs.prices={};
  if(!fs.dupes) fs.dupes={};
  return fs;
}
function currentFS(){ return getFloristSession(state.activeSession, state.activeFlorist); }

function getQty(floristId, flowerId){
  const fs=getFloristSession(state.activeSession, floristId);
  return fs.quantities[flowerId]||0;
}

function setQty(floristId, flowerId, v){
  const fs=getFloristSession(state.activeSession, floristId);
  fs.quantities[flowerId]=Math.max(0,parseInt(v)||0);
  scheduleSave();
  const flower=state.flowers.find(f=>f.id===flowerId);
  const val=fs.quantities[flowerId];
  const sub=document.getElementById('sub_'+flowerId);
  const row=document.getElementById('row_'+flowerId);
  if(sub&&flower){
    const sp=getSessionPrice(floristId,flower.id);
    sub.textContent=val>0?(val*sp).toFixed(2)+'€':'—';
    sub.className='flower-subtotal'+(val===0?' zero':'');
    if(row)row.className='flower-row'+(val>0?' has-qty':'');
  }
  updateBudgetBar(floristId, floristTotal(floristId));
}

function changeQty(fid,flid,d){const nv=Math.max(0,getQty(fid,flid)+d);const inp=document.getElementById('qty_'+flid);if(inp)inp.value=nv;setQty(fid,flid,nv);}

// ── VARIANTS HELPERS ─────────────────────────────────────────────────
function getFlowerVariants(flowerId){
  const f=(state.flowers||[]).find(x=>x.id===flowerId);
  return (f&&f.variants&&f.variants.length>0)?f.variants:null;
}
function flowerTotalQty(floristId, flowerId){
  const vars=getFlowerVariants(flowerId);
  if(!vars) return getQty(floristId,flowerId);
  return vars.reduce((s,v)=>s+getQty(floristId,v.id),0);
}
function flowerTotalDispoQty(flowerId, dateKey){
  const dk=dateKey||state.activeSession;
  const dispoDate=(state.dispo||{})[dk]||{};
  const vars=getFlowerVariants(flowerId);
  if(!vars) return dispoDate[flowerId]||0;
  return vars.reduce((s,v)=>s+(dispoDate[v.id]||0),0);
}

function getSessionPrice(floristId, flowerId){
  const fs=getFloristSession(state.activeSession, floristId);
  if(fs.prices&&fs.prices[flowerId]!=null) return fs.prices[flowerId];
  // Si c'est une dupe, utiliser son prix
  const dupe=(fs.dupes||{})[flowerId];
  if(dupe) return dupe.price;
  const flower=(state.flowers||[]).find(x=>x.id===flowerId);
  return flower?flower.price:0;
}
function setSessionPrice(floristId, flowerId, val){
  const fs=getFloristSession(state.activeSession, floristId);
  const newPrice=parseFloat(val);
  if(isNaN(newPrice)||newPrice<=0) return;

  // Si c'est une dupe, on met à jour son prix dans fs.dupes directement
  if(fs.dupes&&fs.dupes[flowerId]){
    fs.dupes[flowerId].price=newPrice;
  } else {
    // Fleur normale : comparer au prix catalogue
    if(!fs.prices) fs.prices={};
    const flower=(state.flowers||[]).find(x=>x.id===flowerId);
    const catalogPrice=flower?flower.price:0;
    if(Math.abs(newPrice-catalogPrice)<0.001) delete fs.prices[flowerId];
    else fs.prices[flowerId]=newPrice;
  }
  // Sauvegarde immédiate avant re-render
  pushToFirebase();
  renderMain();
}
window.setSessionPrice=setSessionPrice;
// Resolve every harvested line for one session, including variants and duplicates.
function harvestItems(fs){
  const qty=fs.quantities||{}, prices=fs.prices||{}, items=[];
  function add(id,name,price,modified){
    const quantity=qty[id]||0;
    if(quantity>0) items.push({id,name,price,quantity,modified});
  }
  (state.flowers||[]).forEach(f=>{
    const price=prices[f.id]!=null?prices[f.id]:f.price;
    if(f.variants&&f.variants.length){
      f.variants.forEach(v=>add(v.id,f.name+' — '+v.name,price,prices[f.id]!=null));
    }else add(f.id,f.name,price,prices[f.id]!=null);
  });
  Object.entries(fs.dupes||{}).forEach(([id,f])=>{
    add(id,f.name,prices[id]!=null?prices[id]:f.price,true);
  });
  return items;
}
function floristTotal(floristId){
  return harvestItems(getFloristSession(state.activeSession,floristId))
    .reduce((sum,item)=>sum+item.quantity*item.price,0);
}

// Fleurs sélectionnées pour ce fleuriste, dans leur ordre
function floristFlowerOrder(floristId){
  const fs=getFloristSession(state.activeSession, floristId);
  const selected=new Set(fs.selectedIds);
  const ordered=[];
  (fs.flowerOrder||[]).forEach(id=>{if(selected.has(id))ordered.push(id);});
  fs.selectedIds.forEach(id=>{if(!ordered.includes(id))ordered.push(id);});
  fs.flowerOrder=[...ordered];
  // Retourner objets fleur ou dupe
  return ordered.map(id=>{
    const dupe=(fs.dupes||{})[id];
    if(dupe) return {id,name:dupe.name,price:dupe.price,isDupe:true,parentId:dupe.parentId};
    return (state.flowers||[]).find(f=>f.id===id);
  }).filter(Boolean);
}

function isSelected(floristId, flowerId){
  const fs=getFloristSession(state.activeSession, floristId);
  return (fs.selectedIds||[]).includes(flowerId);
}

function toggleSelection(floristId, flowerId){
  const fs=getFloristSession(state.activeSession, floristId);
  const idx=fs.selectedIds.indexOf(flowerId);
  if(idx>=0) fs.selectedIds.splice(idx,1);
  else fs.selectedIds.push(flowerId);
  scheduleSave(); renderMain();
}

function updateBudgetBar(floristId,total){
  const c=(state.florists||[]).find(x=>x.id===floristId);if(!c)return;
  const b=c.budget||0,pct=b>0?Math.min((total/b)*100,100):0,rem=b-total;
  const oc=total>b?'over':total>b*.85?'warn':'ok';
  const bc=total>b?'over':total>b*.85?'warn':'';
  const e=id=>document.getElementById(id);
  if(e('budgetAmt'))e('budgetAmt').textContent=total.toFixed(2);
  if(e('budgetFill')){e('budgetFill').style.width=pct+'%';e('budgetFill').className='progress-fill '+bc;}
  if(e('budgetRem')){e('budgetRem').textContent=rem>=0?'Reste '+rem.toFixed(2)+' €':'Dépassé de '+Math.abs(rem).toFixed(2)+' €';e('budgetRem').className='budget-remaining '+oc;}
  if(e('budgetPct'))e('budgetPct').textContent=pct.toFixed(0)+'% du budget';
}

// ── SOUS-ONGLET SÉLECTION PAR FLEURISTE ──────────────────────────────
function buildSelectionTab(floristId){
  const sorted=[...(state.flowers||[])].sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  const selCount=getFloristSession(state.activeSession,floristId).selectedIds.length;

  const rows=sorted.map(f=>{
    const sel=isSelected(floristId,f.id);
    return `<div class="flower-sel-row${sel?' selected':''}">
      <div class="check-toggle ${sel?'on':''}" onclick="window._togSel('${floristId}','${f.id}')">${sel?'✓':''}</div>
      <span style="flex:1;font-size:.9rem;font-weight:${sel?600:400}">${f.name}</span>
      <span style="font-size:.78rem;color:var(--text2)">${f.price.toFixed(2)} €</span>
    </div>`;
  }).join('');

  const otherFlorists=(state.florists||[]).filter(f=>f.id!==floristId);
  const copyBtns=otherFlorists.length>0
    ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${otherFlorists.map(f=>`<button onclick="window._copySel('${f.id}','${floristId}')" style="padding:6px 12px;border-radius:20px;border:1.5px solid var(--accent2);background:transparent;color:var(--accent);font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer">📋 Copier depuis ${f.name}</button>`).join('')}</div>`
    : '';

  return `<div class="hint">Cochez les fleurs disponibles <strong>pour ce fleuriste</strong> — indépendant des autres.<br>${selCount} sélectionnée${selCount>1?'s':''} sur ${sorted.length}.</div>
    ${copyBtns}
    <div class="search-bar" style="margin-bottom:10px"><span>🔍</span>
      <input id="selSearch" placeholder="Rechercher…" oninput="window._fcs(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="clearSelSearch" onclick="window._fcsc()" style="display:none;background:none;border:none;cursor:pointer;color:var(--text2)">✕</button>
    </div>
    <div class="section-title"><span>${sorted.length} variétés</span><button onclick="window._noneF('${floristId}')">Tout décocher</button></div>
    <div id="selList">${rows}</div>`;
}

window._fcs=function(q){
  const v=q.toLowerCase();
  document.querySelectorAll('#selList .flower-sel-row').forEach(r=>{
    const n=r.querySelector('span');if(!n)return;
    r.style.display=(!v||n.textContent.toLowerCase().includes(v))?'':'none';
  });
  const b=document.getElementById('clearSelSearch');if(b)b.style.display=v?'':'none';
};
window._fcsc=function(){const i=document.getElementById('selSearch');if(i){i.value='';i.focus();}window._fcs('');};
window._togSel=function(fid,flid){toggleSelection(fid,flid);};
window._noneF=function(fid){const fs=getFloristSession(state.activeSession,fid);fs.selectedIds=[];scheduleSave();renderMain();};
window._removeFromF=function(fid,flid){
  const fs=getFloristSession(state.activeSession,fid);
  fs.selectedIds=(fs.selectedIds||[]).filter(x=>x!==flid);
  fs.flowerOrder=(fs.flowerOrder||[]).filter(x=>x!==flid);
  delete fs.quantities[flid];
  delete (fs.prices||{})[flid];
  // Si c'est une fleur parente, supprimer aussi ses dupes
  if(!(fs.dupes||{})[flid]){
    const dupeIds=Object.keys(fs.dupes||{}).filter(k=>(fs.dupes[k].parentId===flid));
    dupeIds.forEach(k=>{
      delete fs.dupes[k];delete fs.quantities[k];
      fs.selectedIds=fs.selectedIds.filter(x=>x!==k);
      fs.flowerOrder=fs.flowerOrder.filter(x=>x!==k);
    });
  } else {
    // C'est une dupe, juste la supprimer
    delete fs.dupes[flid];
  }
  scheduleSave();renderMain();
};
window._dupRow=function(fid,flid){
  const fs=getFloristSession(state.activeSession,fid);
  if(!fs.dupes) fs.dupes={};
  const flower=(state.flowers||[]).find(x=>x.id===flid);
  if(!flower) return;
  // Créer un ID unique pour cette dupe
  const dupeId='dupe_'+flid+'_'+uid();
  const parentPrice=getSessionPrice(fid,flid);
  fs.dupes[dupeId]={parentId:flid,name:flower.name+' (2)',price:parentPrice};
  // Insérer après la fleur parente dans l'ordre
  const idx=fs.flowerOrder.indexOf(flid);
  if(idx>=0) fs.flowerOrder.splice(idx+1,0,dupeId);
  else fs.flowerOrder.push(dupeId);
  fs.selectedIds.push(dupeId);
  scheduleSave();renderMain();
};
window._copySel=function(fromFid,toFid){
  const fromFs=getFloristSession(state.activeSession,fromFid);
  const toFs=getFloristSession(state.activeSession,toFid);
  const fromName=(state.florists||[]).find(f=>f.id===fromFid)?.name||fromFid;
  if(!confirm('Copier la sélection de '+fromName+' ? Les fleurs actuelles seront remplacées (pas les quantités).')) return;
  toFs.selectedIds=[...(fromFs.selectedIds||[])];
  toFs.flowerOrder=[...(fromFs.flowerOrder||[])];
  scheduleSave();renderMain();showToast('Sélection copiée !');
};
window._hsub=function(t){state.harvestSubTab=t;renderMain();};

// ── SEAUX ─────────────────────────────────────────────────────────────
const SEAU_TYPES=[
  {id:'procona',label:'Procona',color:'#c0392b'},
  {id:'petit',label:'Petit',color:'#e67e22'},
  {id:'carre',label:'Carré',color:'#5c8a3c'},
];

function migrateSeaux(){
  // Migration depuis l'ancien format {total,mouvements:[{type:'sortie'...}]}
  if(!state.seaux) state.seaux={stock:{procona:0,petit:0,carre:0},mouvements:[]};
  if(!state.seaux.stock) state.seaux.stock={procona:0,petit:0,carre:0};
  if(state.seaux.stock.procona==null) state.seaux.stock.procona=0;
  if(state.seaux.stock.petit==null) state.seaux.stock.petit=0;
  if(state.seaux.stock.carre==null) state.seaux.stock.carre=0;
  if(!Array.isArray(state.seaux.mouvements)) state.seaux.mouvements=[];
  // Migrer les anciens mouvements (avaient 'type' = sens, pas de type de seau)
  state.seaux.mouvements.forEach(m=>{
    if(m.sens==null && m.type && (m.type==='sortie'||m.type==='retour')){
      m.sens=m.type;
      m.type='procona'; // par défaut on suppose procona pour l'ancien
    }
    if(!m.type) m.type='procona';
    if(!m.sens) m.sens='sortie';
  });
}

function seauxDehorsParFleuriste(){
  // Retourne { fleuriste: {procona:n, petit:n, carre:n} }
  const out={};
  (state.seaux.mouvements||[]).forEach(m=>{
    const f=m.fleuriste||'—';
    if(!out[f]) out[f]={procona:0,petit:0,carre:0};
    const delta=(m.sens==='sortie'?m.qty:-m.qty);
    out[f][m.type]=(out[f][m.type]||0)+delta;
  });
  return out;
}

function buildSeaux(){
  migrateSeaux();
  const seaux=state.seaux;
  const stock=seaux.stock;
  const mouvements=(seaux.mouvements||[]).slice().reverse();

  const dehorsAll=seauxDehorsParFleuriste();
  // Filtrer les fleuristes qui ont au moins 1 seau dehors
  const dehorsList=Object.entries(dehorsAll)
    .map(([f,types])=>({f,types,total:types.procona+types.petit+types.carre}))
    .filter(x=>x.total>0)
    .sort((a,b)=>b.types.procona-a.types.procona || b.total-a.total);

  // Totaux dehors par type
  const totalDehors={procona:0,petit:0,carre:0};
  dehorsList.forEach(x=>{
    totalDehors.procona+=Math.max(0,x.types.procona);
    totalDehors.petit+=Math.max(0,x.types.petit);
    totalDehors.carre+=Math.max(0,x.types.carre);
  });

  const florists=state.florists||[];
  const floristOpts=florists.map(f=>`<option value="${f.name}">`).join('');

  // Cartes stock par type
  const stockCards=SEAU_TYPES.map(t=>{
    const d=totalDehors[t.id];
    return `<div class="cmd-card" style="flex:1;margin-bottom:0;padding:12px 10px;text-align:center;border-top:3px solid ${t.color}">
      <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);font-weight:600">${t.label}</div>
      <div style="font-family:'DM Serif Display',serif;font-size:1.7rem;color:${t.color}">${stock[t.id]}</div>
      <div style="font-size:.68rem;color:var(--text2)">au dépôt</div>
      ${d>0?`<div style="font-size:.72rem;color:var(--warning);font-weight:600;margin-top:3px">${d} dehors</div>`:'<div style="font-size:.72rem;color:var(--text2);margin-top:3px">—</div>'}
    </div>`;
  }).join('');

  // Section dehors par fleuriste
  const dehorsHTML=dehorsList.length>0
    ? dehorsList.map(x=>{
        const badges=SEAU_TYPES.filter(t=>x.types[t.id]>0).map(t=>
          `<span style="background:${t.color};color:#fff;border-radius:10px;padding:2px 8px;font-size:.72rem;font-weight:600;white-space:nowrap">${x.types[t.id]} ${t.label}</span>`
        ).join(' ');
        return `<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1;font-weight:600;font-size:.9rem">${x.f}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${badges}</div>
        </div>`;
      }).join('')
    : '<div class="empty" style="padding:14px 0">Aucun seau dehors 🎉</div>';

  // Historique
  const histHTML=mouvements.slice(0,40).map(m=>{
    const isOut=m.sens==='sortie';
    const t=SEAU_TYPES.find(x=>x.id===m.type)||SEAU_TYPES[0];
    const realIdx=(seaux.mouvements||[]).indexOf(m);
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.83rem">
      <span style="font-size:1rem">${isOut?'📤':'📥'}</span>
      <div style="flex:1;min-width:0">
        <span style="font-weight:600;color:${isOut?'var(--warning)':'var(--accent)'}">${isOut?'Sortie':'Retour'} ${m.qty}</span>
        <span style="background:${t.color};color:#fff;border-radius:8px;padding:1px 6px;font-size:.68rem;margin:0 4px">${t.label}</span>
        ${m.fleuriste?`<span style="color:var(--text2)">${m.fleuriste}</span>`:''}
      </div>
      <span style="font-size:.7rem;color:var(--text2);white-space:nowrap">${m.date}</span>
      <button onclick="window._delMouvement(${realIdx})" style="background:none;border:none;color:#ccc;font-size:.8rem;cursor:pointer;padding:0 2px">✕</button>
    </div>`;
  }).join('');

  return `
    <div style="display:flex;gap:8px;margin-bottom:14px">${stockCards}</div>

    <div class="cmd-card">
      <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);margin-bottom:10px">Enregistrer un mouvement</div>
      <div style="display:flex;gap:5px;margin-bottom:10px">
        ${SEAU_TYPES.map(t=>`<button onclick="window._selSeauType('${t.id}')" id="seauType_${t.id}" style="flex:1;padding:9px;border-radius:9px;border:2px solid ${state._seauType===t.id?t.color:'var(--border)'};background:${state._seauType===t.id?t.color:'transparent'};color:${state._seauType===t.id?'#fff':'var(--text2)'};font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer">${t.label}</button>`).join('')}
      </div>
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px">
        <input id="seauQty" type="number" min="1" value="1" inputmode="numeric" style="width:56px;padding:9px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:1rem;font-weight:700;text-align:center;background:var(--bg);color:var(--text);-moz-appearance:textfield;appearance:textfield">

    </div>

    <div class="cmd-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text2)">Dehors par fleuriste</span>
        ${dehorsList.length>0?`<span style="font-size:.72rem;color:var(--warning);font-weight:600">${totalDehors.procona} Procona dehors</span>`:''}
      </div>
      ${dehorsHTML}
    </div>

    <div class="cmd-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text2)">Historique</span>
        <button onclick="window._setSeauStock()" style="font-size:.75rem;color:var(--accent);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600">Ajuster stock dépôt</button>
      </div>
      ${histHTML||'<div class="empty" style="padding:14px 0">Aucun mouvement</div>'}
    </div>`;
}

window._selSeauType=function(t){state._seauType=t;renderMain();};

window._seauMouv=function(sens){
  migrateSeaux();
  const type=state._seauType||'procona';
  const qty=parseInt(document.getElementById('seauQty').value)||0;
  if(qty<=0)return;
  const fleuriste=document.getElementById('seauFleuriste').value.trim();
  if(sens==='sortie' && !fleuriste){
    alert('Choisis un fleuriste pour une sortie (nécessaire pour suivre les retours).');
    return;
  }
  const now=new Date();
  const date=now.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' '+now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  state.seaux.mouvements.push({date,sens,type,qty,fleuriste});
  // Mise à jour stock dépôt
  if(sens==='sortie') state.seaux.stock[type]=Math.max(0,(state.seaux.stock[type]||0)-qty);
  else state.seaux.stock[type]=(state.seaux.stock[type]||0)+qty;
  pushToFirebase();renderMain();
  const tlabel=(SEAU_TYPES.find(x=>x.id===type)||{}).label;
  showToast((sens==='sortie'?'Sortie':'Retour')+' '+qty+' '+tlabel);
};

window._delMouvement=function(idx){
  migrateSeaux();
  const m=state.seaux.mouvements[idx];
  if(!m)return;
  if(!confirm('Supprimer ce mouvement ?'))return;
  // Annuler l'effet sur le stock
  if(m.sens==='sortie') state.seaux.stock[m.type]=(state.seaux.stock[m.type]||0)+m.qty;
  else state.seaux.stock[m.type]=Math.max(0,(state.seaux.stock[m.type]||0)-m.qty);
  state.seaux.mouvements.splice(idx,1);
  pushToFirebase();renderMain();
};

window._setSeauStock=function(){
  migrateSeaux();
  const s=state.seaux.stock;
  const p=prompt('Stock Procona au dépôt :',s.procona);
  if(p===null)return;
  const pe=prompt('Stock Petit au dépôt :',s.petit);
  if(pe===null)return;
  const c=prompt('Stock Carré au dépôt :',s.carre);
  if(c===null)return;
  s.procona=Math.max(0,parseInt(p)||0);
  s.petit=Math.max(0,parseInt(pe)||0);
  s.carre=Math.max(0,parseInt(c)||0);
  pushToFirebase();renderMain();
  showToast('Stock dépôt ajusté');
};

// ── COMMANDES ─────────────────────────────────────────────────────────
function parseCommande(text){
  const cmd={
    id:'cmd_'+uid(),
    numero:'',
    fleuriste:'',
    entreprise:'',
    email:'',
    date:'',
    statut:'attente',
    lignes:[],
    importDate:todayKey()
  };
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);

  lines.forEach(line=>{
    // Numéro de commande
    let m=line.match(/commande[:\s#]*#?([a-f0-9]{6,})/i);
    if(m && !cmd.numero) cmd.numero=m[1];
    // Nom fleuriste
    m=line.match(/^Nom[:\s]+(.+)$/i);
    if(m) cmd.fleuriste=m[1].trim();
    // Email
    m=line.match(/^Email[:\s]+(.+)$/i);
    if(m) cmd.email=m[1].trim();
    // Entreprise
    m=line.match(/^Entreprise[:\s]+(.+)$/i);
    if(m) cmd.entreprise=m[1].trim();
    // Date
    m=line.match(/^Date[:\s]+(.+)$/i);
    if(m && !cmd.date) cmd.date=m[1].trim();
  });

  // Parser les lignes de fleurs
  // Format: "Nom fleur   Bottes   Tiges   €Prix/botte   €Sous-total"
  // Ex: "Chasmantium 2 20 €4.00 €8.00"
  lines.forEach(line=>{
    // Ignorer les en-têtes et totaux
    if(/^(fleur|total|informations|détail|numéro|date|statut|nom|email|entreprise|ferme|nouvelle|cette)/i.test(line)) return;
    // Chercher le pattern : texte + 2 nombres + 2 montants €
    const m=line.match(/^(.+?)\s+(\d+)\s+(\d+)\s+€?([\d.,]+)\s+€?([\d.,]+)$/);
    if(m){
      const nom=m[1].trim();
      const bottes=parseInt(m[2])||0;
      const tiges=parseInt(m[3])||0;
      const prixBotte=parseFloat(m[4].replace(',','.'))||0;
      const soustotal=parseFloat(m[5].replace(',','.'))||0;
      if(nom && bottes>0){
        // prix/tige = prix/botte ÷ (tiges/bottes), généralement botte=10 tiges
        const tigesParBotte = bottes>0 ? (tiges/bottes) : 10;
        const prixTige = tigesParBotte>0 ? (prixBotte/tigesParBotte) : 0;
        cmd.lignes.push({nom,tiges,prixTige,soustotal,coche:false});
      }
    }
  });

  return cmd;
}

function buildCommandes(){
  // Vue détail d'une commande
  if(state.activeCommande && state.commandes[state.activeCommande]){
    return buildCommandeDetail(state.commandes[state.activeCommande]);
  }

  // Liste des commandes + zone d'import
  const cmds=Object.values(state.commandes||{}).sort((a,b)=>(b.importDate||'').localeCompare(a.importDate||''));

  const cmdList=cmds.length>0
    ? cmds.map(c=>{
        const done=c.lignes.filter(l=>l.coche).length;
        const total=c.lignes.length;
        const totalEuros=c.lignes.reduce((s,l)=>{const pt=l.prixTige!=null?l.prixTige:(l.prixBotte?l.prixBotte/10:0);return s+(l.tiges||0)*pt;},0);
        const statutLabels={attente:'En attente',prep:'En préparation',prete:'Prête',terminee:'Terminée'};
        return `<div class="cmd-list-item" onclick="window._openCmd('${c.id}')">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div style="flex:1;min-width:0">
              <div style="font-family:'DM Serif Display',serif;font-size:1rem">${c.fleuriste||'Sans nom'}</div>
              <div style="font-size:.76rem;color:var(--text2)">${c.entreprise||''} ${c.numero?'· #'+c.numero:''}</div>
            </div>
            <span class="cmd-statut ${c.statut}">${statutLabels[c.statut]}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
            <span style="font-size:.78rem;color:var(--text2)">${done}/${total} préparées · ${totalEuros.toFixed(2)} €</span>
            <span style="font-size:.72rem;color:var(--text2)">${c.importDate}</span>
          </div>
        </div>`;
      }).join('')
    : '<div class="empty" style="padding:20px 0">Aucune commande. Collez le texte d\'un email de commande ci-dessous.</div>';

  return `
    <div class="cmd-card">
      <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);margin-bottom:8px">Importer une commande</div>
      <textarea class="cmd-paste-area" id="cmdPaste" placeholder="Colle ici le texte complet de l'email de commande (fleuriste, entreprise, et le tableau des fleurs)…"></textarea>
      <button onclick="window._importCmd()" style="width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-family:inherit;font-size:.88rem;font-weight:700;cursor:pointer;margin-top:8px">📥 Importer la commande</button>
    </div>
    <div class="section-title"><span>${cmds.length} commande(s)</span></div>
    ${cmdList}`;
}

function buildCommandeDetail(c){

    const tiges=l.tiges||0;
    const prixTige=l.prixTige!=null?l.prixTige:(l.prixBotte?l.prixBotte/10:0);
    const sub=tiges*prixTige;
    return {...l,_idx:i,tiges,prixTige,sub};
  });
  const totalEuros=lignesCalc.reduce((s,l)=>s+l.sub,0);
  const totalTiges=lignesCalc.reduce((s,l)=>s+l.tiges,0);
  const done=c.lignes.filter(l=>l.coche).length;
  const total=c.lignes.length;

  // Autres commandes du même fleuriste pour fusion

        <button class="qty-btn" onclick="window._cmdTige('${c.id}',${l._idx},1)">+</button>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:52px">
        <div class="cmd-line-sub">${l.sub.toFixed(2)}€</div>
        <button onclick="window._delLigne('${c.id}',${l._idx})" style="background:none;border:none;color:#ccc;font-size:.8rem;cursor:pointer;padding:0">✕</button>
      </div>
    </div>`;
  }).join('');

  const catalogOpts=(state.flowers||[]).map(f=>`<option value="${f.name}">`).join('');

  return `

    <div class="cmd-card">
      <div class="cmd-header">

      <div style="display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px;padding:10px 12px;background:var(--surface2);border-radius:10px">

        <button onclick="window._setStatut('${c.id}','prep')" class="cmd-statut prep" style="border:none;cursor:pointer;opacity:${c.statut==='prep'?1:.4}">En préparation</button>
        <button onclick="window._setStatut('${c.id}','prete')" class="cmd-statut prete" style="border:none;cursor:pointer;opacity:${c.statut==='prete'?1:.4}">Prête</button>
        <button onclick="window._setStatut('${c.id}','terminee')" class="cmd-statut" style="border:none;cursor:pointer;background:#f3e5f5;color:#6a1b9a;opacity:${c.statut==='terminee'?1:.4}">✓ Terminée</button>

        <datalist id="catalogNames">${catalogOpts}</datalist>

}

window._importCmd=function(){
  const txt=document.getElementById('cmdPaste').value.trim();
  if(!txt){alert('Colle d\'abord le texte de la commande.');return;}
  const cmd=parseCommande(txt);
  if(cmd.lignes.length===0){
    alert('Aucune ligne de fleur détectée. Vérifie que tu as bien collé le tableau des fleurs (format: Nom Bottes Tiges €Prix €Soustotal).');
    return;
  }
  if(!state.commandes) state.commandes={};
  state.commandes[cmd.id]=cmd;
  pushToFirebase();
  state.activeCommande=cmd.id;
  renderMain();
  showToast('Commande importée : '+cmd.lignes.length+' fleurs');
};
window._openCmd=function(id){state.activeCommande=id;renderMain();};
window._closeCmd=function(){state.activeCommande=null;renderMain();};
window._toggleLigne=function(cmdId,idx){
  const c=state.commandes[cmdId];if(!c)return;
  c.lignes[idx].coche=!c.lignes[idx].coche;
  // Auto-statut : si toutes cochées → prête, si au moins une → prep
  const done=c.lignes.filter(l=>l.coche).length;
  if(done===c.lignes.length) c.statut='prete';
  else if(done>0) c.statut='prep';
  else c.statut='attente';
  pushToFirebase();renderMain();
};
window._setStatut=function(cmdId,s){
  const c=state.commandes[cmdId];if(!c)return;
  c.statut=s;pushToFirebase();renderMain();
};
window._deleteCmd=function(cmdId){
  if(!confirm('Supprimer cette commande ?'))return;
  delete state.commandes[cmdId];
  state.activeCommande=null;
  pushToFirebase();renderMain();
};
window._cmdTige=function(cmdId,idx,d){
  const c=state.commandes[cmdId];if(!c||!c.lignes[idx])return;
  const l=c.lignes[idx];
  l.tiges=Math.max(0,(l.tiges||0)+d);
  const pt=l.prixTige!=null?l.prixTige:(l.prixBotte?l.prixBotte/10:0);
  l.soustotal=l.tiges*pt;
  pushToFirebase();renderMain();
};
window._cmdTigeSet=function(cmdId,idx,val){
  const c=state.commandes[cmdId];if(!c||!c.lignes[idx])return;
  const l=c.lignes[idx];
  l.tiges=Math.max(0,parseInt(val)||0);
  const pt=l.prixTige!=null?l.prixTige:(l.prixBotte?l.prixBotte/10:0);
  l.soustotal=l.tiges*pt;
  pushToFirebase();renderMain();
};
window._delLigne=function(cmdId,idx){
  const c=state.commandes[cmdId];if(!c)return;
  c.lignes.splice(idx,1);
  pushToFirebase();renderMain();
};
window._addLigne=function(cmdId){
  const c=state.commandes[cmdId];if(!c)return;
  const name=document.getElementById('addLigneName').value.trim();
  if(!name)return;
  const flower=(state.flowers||[]).find(f=>f.name.toLowerCase()===name.toLowerCase());
  const prixTige=flower?flower.price:0;
  c.lignes.push({nom:name,tiges:10,prixTige:prixTige,soustotal:10*prixTige,coche:false});
  pushToFirebase();renderMain();
};
window._mergeCmd=function(targetId,sourceId){
  const target=state.commandes[targetId];
  const source=state.commandes[sourceId];
  if(!target||!source)return;
  if(!confirm('Fusionner ces deux commandes ? Les lignes de la commande #'+(source.numero||source.importDate)+' seront ajoutées à celle-ci, puis l\'autre sera supprimée.'))return;
  // Ajouter les lignes de source à target
  source.lignes.forEach(l=>target.lignes.push({...l}));
  delete state.commandes[sourceId];
  pushToFirebase();renderMain();
  showToast('Commandes fusionnées');
};

// ── SÉCHÉES ───────────────────────────────────────────────────────────

  const sorted=[...sechees].sort((a,b)=>a.name.localeCompare(b.name,'fr'));

          <span style="font-size:.72rem;color:var(--text2)">€/botte${stock>0?' · <strong style="color:var(--accent)">'+val+' €</strong>':''}</span>
        </div>

      <div class="qty-ctrl">
        <button class="qty-btn" onclick="window._secStock('${f.id}',-1)">−</button>
        <input class="qty-input" inputmode="numeric" pattern="[0-9]*" value="${stock}" onfocus="this.select()" onblur="window._editSec('${f.id}','stock',this.value)" style="width:40px">
        <button class="qty-btn" onclick="window._secStock('${f.id}',1)">+</button>
      </div>
      <button onclick="window._delSec('${f.id}')" style="background:none;border:none;color:#ccc;font-size:.9rem;cursor:pointer;padding:2px">✕</button>

  }).join('');

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div>
        <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text2)">Stock fleurs séchées</div>
        <div style="font-family:'DM Serif Display',serif;font-size:1.6rem">${totalBottes} <span style="font-size:1rem;color:var(--text2)">bottes</span></div>
        <div style="font-size:.9rem;color:var(--accent);font-weight:600;margin-top:2px">${totalValue.toFixed(2)} € valeur stock</div>
      </div>
    </div>
    <div class="add-row" style="margin-bottom:14px">
      <input id="secName" placeholder="Nouvelle fleur séchée…">
      <input id="secPu" type="number" step="0.10" min="0" placeholder="Prix/botte" style="width:90px;padding:9px 8px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:.82rem;background:var(--surface);color:var(--text);-moz-appearance:textfield;appearance:textfield">
      <button class="btn-add" onclick="window._addSec()">+ </button>
    </div>
    <div class="search-bar" style="margin-bottom:10px"><span>🔍</span>
      <input id="secSearch" placeholder="Rechercher…" oninput="window._fsec(this.value)" autocomplete="off" spellcheck="false">
      <button onclick="window._fsecc()" style="display:none;background:none;border:none;cursor:pointer;color:var(--text2)" id="clearSecSearch">✕</button>
    </div>
    <div class="section-title"><span>${sechees.length} variété(s) séchée(s)</span></div>

window._addSec=function(){
  const name=document.getElementById('secName').value.trim();
  const pu=parseFloat(document.getElementById('secPu').value)||0;

  if(!state.sechees)state.sechees=[];

window._editSec=function(id,field,val){

};
window._secStock=function(id,d){

window._delSec=function(id){

window._fsec=function(q){
