// ── MIX ───────────────────────────────────────────────────────────────
function buildMix(){
  const florists=state.florists||[];
  if(!state.mixFloristId||!florists.find(f=>f.id===state.mixFloristId)){
    state.mixFloristId=(florists[0]||{}).id;
  }
  const budget=state.mixBudget||100;

  // Fleurs disponibles = fleurs du catalogue (toutes)
  const flowers=(state.flowers||[]).filter(f=>!getFlowerVariants(f.id)); // sans variantes pour simplifier
  const priorities=state.mixPriorities||{};

  // Calcul du mix
  const activePrios=flowers.map(f=>({f,prio:priorities[f.id]||0})).filter(x=>x.prio>0);
  let mixResult=[];
  let totalUsed=0;

  // Limites par niveau de priorité
  const maxQtyByPrio={1:15,2:30,3:50}; // B=15, M=30, H=50 tiges max
  const weightsByPrio={1:1,2:2,3:4};   // B=1, M=2, H=4 (poids budget)

  if(activePrios.length>0){
    const totalWeight=activePrios.reduce((s,x)=>s+weightsByPrio[x.prio],0);
    mixResult=activePrios.map(({f,prio})=>{
      const share=(weightsByPrio[prio]/totalWeight)*budget;
      const maxQty=maxQtyByPrio[prio];
      const qty=Math.min(maxQty, Math.floor(share/f.price));
      const cost=qty*f.price;
      return {f,qty,cost,prio};
    }).filter(x=>x.qty>0);
    totalUsed=mixResult.reduce((s,x)=>s+x.cost,0);
    // Distribuer le budget restant aux fleurs H qui ont de la marge
    let remaining=budget-totalUsed;
    const sorted=[...mixResult].sort((a,b)=>b.prio-a.prio||b.f.price-a.f.price);
    for(const item of sorted){
      if(remaining<item.f.price) break;
      const maxExtra=maxQtyByPrio[item.prio]-item.qty;
      if(maxExtra<=0) continue;
      const extra=Math.min(maxExtra, Math.floor(remaining/item.f.price));
      if(extra>0){
        item.qty+=extra;
        item.cost+=extra*item.f.price;
        remaining-=extra*item.f.price;
        totalUsed+=extra*item.f.price;
      }
    }
  }

  const pct=budget>0?Math.min((totalUsed/budget)*100,100):0;

  // Florist selector
  const floristSel=`<div class="florist-selector" style="margin-bottom:12px">
    ${florists.map(c=>`<button class="fs-btn ${c.id===state.mixFloristId?'active':''}" onclick="window._mixF('${c.id}')">${c.name}</button>`).join('')}
  </div>`;

  // Priority rows
  const prioRows=flowers.map(f=>{
    const p=priorities[f.id]||0;
    return `<div class="mix-row">
      <div class="mix-name">${f.name}</div>
      <div class="mix-price">${f.price.toFixed(2)}€</div>
      <div class="priority-btns">
        <button class="prio-btn ${p===1?'active-1':''}" onclick="window._setPrio('${f.id}',${p===1?0:1})" title="Basse">B</button>
        <button class="prio-btn ${p===2?'active-2':''}" onclick="window._setPrio('${f.id}',${p===2?0:2})" title="Moyenne">M</button>
        <button class="prio-btn ${p===3?'active-3':''}" onclick="window._setPrio('${f.id}',${p===3?0:3})" title="Haute">H</button>
      </div>
    </div>`;
  }).join('');

  // Result
  const resultRows=mixResult.length>0
    ? mixResult.map(({f,qty,cost,prio})=>{
        const labels={1:'Basse (1-3 bottes)',2:'Moyenne (4-6 bottes)',3:'Haute (7+ bottes)'};
        const colors={1:'#1565c0',2:'#e65100',3:'#c62828'};
        return `<div class="mix-result-row">
          <div>
            <div style="font-weight:600;font-size:.88rem">${f.name}</div>
            <div style="font-size:.72rem;color:var(--text2)">${f.price.toFixed(2)} €/u · priorité <span style="color:${colors[prio]};font-weight:600">${labels[prio]}</span></div>
          </div>
          <div style="text-align:right">
            <span class="mix-qty-badge">${qty} tiges</span>
            <div style="font-size:.75rem;color:var(--text2);margin-top:2px">${cost.toFixed(2)} €</div>
          </div>
        </div>`;
      }).join('')
    : '<div class="empty" style="padding:20px 0">Sélectionne au moins une fleur avec une priorité</div>';

  const applyBtn=mixResult.length>0
    ? `<button onclick="window._applyMix()" style="width:100%;padding:13px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:12px">
        ✅ Appliquer à ${(florists.find(f=>f.id===state.mixFloristId)||{}).name||''}
      </button>`
    : '';

  return `
    <div class="hint">Choisis un fleuriste et le budget. Définis la disponibilité de chaque fleur : <strong>B</strong> = 1-3 bottes (max 15 tiges) · <strong>M</strong> = 4-6 bottes (max 30) · <strong>H</strong> = 7+ bottes (max 50). L'app répartit le budget en respectant ces limites.</div>
    ${floristSel}
    <div class="mix-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div style="flex:1;font-size:.75rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text2)">Budget</div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <input type="number" min="0" step="5" value="${budget}" inputmode="numeric"
          onblur="window._mixBudget(this.value)"
          style="width:80px;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:1rem;font-weight:700;text-align:right;background:var(--bg);color:var(--text);-moz-appearance:textfield;appearance:textfield"> €
        ${[100,300,400,500].map(b=>`<button onclick="window._mixBudget(${b})" style="padding:5px 10px;border-radius:16px;border:1.5px solid ${budget===b?'var(--accent)':'var(--border)'};background:${budget===b?'var(--accent)':'transparent'};color:${budget===b?'#fff':'var(--text2)'};font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer">${b}€</button>`).join('')}
      </div>
      </div>
      ${activePrios.length>0?`
        <div class="mix-total-bar"><div class="mix-total-fill" style="width:${pct}%"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:.78rem;color:var(--text2);margin-bottom:10px">
          <span>${totalUsed.toFixed(2)} € utilisés</span>
          <span>${(budget-totalUsed).toFixed(2)} € restants</span>
        </div>`:''}
      <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);margin-bottom:8px">Résultat du mix</div>
      ${resultRows}
      ${applyBtn}
    </div>
    <div class="mix-card">
      <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);margin-bottom:8px">Priorités par fleur</div>
      <div class="search-bar" style="margin-bottom:10px"><span>🔍</span>
        <input id="mixSearch" placeholder="Rechercher…" oninput="window._fmix(this.value)" autocomplete="off" spellcheck="false">
        <button onclick="window._fmixc()" style="display:none;background:none;border:none;cursor:pointer;color:var(--text2)" id="clearMixSearch">✕</button>
      </div>
      <div id="mixPrioList">${prioRows}</div>
      <button onclick="window._resetPrios()" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:transparent;font-family:inherit;font-size:.82rem;color:var(--text2);cursor:pointer;margin-top:10px">Réinitialiser les priorités</button>
    </div>`;
}

window._mixF=function(id){state.mixFloristId=id;renderMain();};
window._mixBudget=function(v){
  const val=parseFloat(v)||100;
  state.mixBudget=val;
  // Sync l'input si appelé depuis un bouton
  const inp=document.querySelector('input[type=number][onblur*="_mixBudget"]');
  if(inp) inp.value=val;
  renderMain();
};
window._setPrio=function(fid,p){
  if(!state.mixPriorities)state.mixPriorities={};
  if(p===0)delete state.mixPriorities[fid];
  else state.mixPriorities[fid]=p;
  renderMain();
};
window._resetPrios=function(){state.mixPriorities={};renderMain();};
window._applyMix=function(){
  const florists=state.florists||[];
  const fid=state.mixFloristId;
  if(!fid) return;
  const budget=state.mixBudget||100;
  const flowers=(state.flowers||[]).filter(f=>!getFlowerVariants(f.id));
  const priorities=state.mixPriorities||{};
  const activePrios=flowers.map(f=>({f,prio:priorities[f.id]||0})).filter(x=>x.prio>0);
  if(!activePrios.length) return;
  const maxQtyByPrio={1:15,2:30,3:50};
  const weightsByPrio={1:1,2:2,3:4};
  const totalWeight=activePrios.reduce((s,x)=>s+weightsByPrio[x.prio],0);
  const mixResult=activePrios.map(({f,prio})=>{
    const share=(weightsByPrio[prio]/totalWeight)*budget;
    const qty=Math.min(maxQtyByPrio[prio],Math.floor(share/f.price));
    return{f,qty,prio};
  }).filter(x=>x.qty>0);
  let totalUsed=mixResult.reduce((s,x)=>s+x.qty*x.f.price,0);
  let remaining=budget-totalUsed;
  const sorted=[...mixResult].sort((a,b)=>b.prio-a.prio||b.f.price-a.f.price);
  for(const item of sorted){
    if(remaining<item.f.price) break;
    const maxExtra=maxQtyByPrio[item.prio]-item.qty;
    if(maxExtra<=0) continue;
    const extra=Math.min(maxExtra,Math.floor(remaining/item.f.price));
    if(extra>0){item.qty+=extra;remaining-=extra*item.f.price;}
  }
  // Appliquer dans la session
  const c=florists.find(x=>x.id===fid);
  if(!c) return;
  const floristName=c.name;
  if(!confirm('Appliquer ce mix à '+floristName+' ? Les quantités actuelles seront remplacées.')) return;
  const fs=getFloristSession(state.activeSession,fid);
  // Reset quantities pour les fleurs du mix
  mixResult.forEach(({f,qty})=>{
    fs.quantities[f.id]=qty;
    // Ajouter à la sélection si pas déjà dedans
    if(!fs.selectedIds.includes(f.id)){
      fs.selectedIds.push(f.id);
      fs.flowerOrder.push(f.id);
    }
  });
  pushToFirebase();
  state.activeTab='harvest';
  state.activeFlorist=fid;
  renderMain();
  showToast('Mix appliqué à '+floristName+' !');
};
window._fmix=function(q){
  const v=q.toLowerCase();
  document.querySelectorAll('#mixPrioList .mix-row').forEach(r=>{
    const n=r.querySelector('.mix-name');
    if(!n) return;
    r.style.display=(!v||n.textContent.toLowerCase().includes(v))?'':'none';
  });
  const b=document.getElementById('clearMixSearch');if(b)b.style.display=v?'':'none';
};
window._fmixc=function(){const i=document.getElementById('mixSearch');if(i){i.value='';i.focus();}window._fmix('');};

// ── DISPO ─────────────────────────────────────────────────────────────
function buildDispo(){
  const today=todayKey();
  const dispoDate=(state.dispo||{})[today]||{};

  // Tri : fleurs avec qté > 0 en premier, puis alphabétique
  const flowers=[...(state.flowers||[])].sort((a,b)=>{
    const aQty=getFlowerVariants(a.id)
      ? (getFlowerVariants(a.id)||[]).reduce((s,v)=>s+(dispoDate[v.id]||0),0)
      : (dispoDate[a.id]||0);
    const bQty=getFlowerVariants(b.id)
      ? (getFlowerVariants(b.id)||[]).reduce((s,v)=>s+(dispoDate[v.id]||0),0)
      : (dispoDate[b.id]||0);
    if(aQty>0 && bQty===0) return -1;
    if(aQty===0 && bQty>0) return 1;
    return a.name.localeCompare(b.name,'fr');
  });

  const rows=flowers.map(f=>{
    const vars=getFlowerVariants(f.id);
    if(vars){
      const totalDispo=vars.reduce((s,v)=>s+(dispoDate[v.id]||0),0);
      const isOpen=!!(state.expandedGroups||{})['dispo_'+f.id];
      const varRows=vars.map(v=>{
        const dq=dispoDate[v.id]||0;
        const vSub=(dq*f.price).toFixed(2);
        return `<div class="dispo-variant-row">
          <div style="flex:1;min-width:0">
            <div class="variant-name" style="font-size:.85rem">${v.name}</div>
            <div style="font-size:.72rem;color:var(--text2)">${f.price.toFixed(2)} €/u${dq>0?' · <strong style="color:var(--accent)">'+vSub+' €</strong>':''}</div>
          </div>
          <div class="dispo-qty-ctrl qty-ctrl">
            <button class="qty-btn" onclick="window._setDispo('${v.id}',${0},-1)">−</button>
            <input class="qty-input" inputmode="numeric" pattern="[0-9]*" value="${dq}" onfocus="this.select()" onchange="window._setDispoVal('${v.id}',this.value)" onblur="window._setDispoVal('${v.id}',this.value)">
            <button class="qty-btn" onclick="window._setDispo('${v.id}',${0},1)">+</button>
          </div>
          ${dq>0?`<div style="font-weight:700;font-size:.82rem;color:var(--accent);min-width:54px;text-align:right">${vSub}€</div>`:'<div style="min-width:54px"></div>'}
        </div>`;
      }).join('');
      const groupEuros=(totalDispo*f.price).toFixed(2);
      return `<div class="dispo-group${totalDispo>0?' has-dispo':''}">
        <div class="dispo-group-header" onclick="window._toggleGroup('dispo_${f.id}')">
          <span class="group-toggle ${isOpen?'open':''}">▶</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:.9rem">${f.name}</div>
            <div style="font-size:.72rem;color:var(--text2)">${f.price.toFixed(2)} €/u${totalDispo>0?' · <strong style="color:var(--accent)">'+groupEuros+' €</strong>':''}</div>
          </div>
          <span class="dispo-badge${totalDispo>0?' ok':''}">${totalDispo>0?totalDispo+' tiges':'—'}</span>
        </div>
        ${isOpen?`<div class="dispo-group-variants">${varRows}</div>`:''}
      </div>`;
    }
    const dq=dispoDate[f.id]||0;
    const dSub=(dq*f.price).toFixed(2);
    return `<div class="dispo-row${dq>0?' has-dispo':''}">
      <div style="flex:1;min-width:0">
        <div class="dispo-name">${f.name}</div>
        <div style="font-size:.73rem;color:var(--text2);margin-top:1px">${f.price.toFixed(2)} €/u${dq>0?' · <strong style="color:var(--accent)">'+dSub+' €</strong>':''}</div>
      </div>
      <div class="dispo-qty-ctrl qty-ctrl">
        <button class="qty-btn" onclick="window._setDispo('${f.id}',${0},-1)">−</button>
        <input class="qty-input" inputmode="numeric" pattern="[0-9]*" value="${dq}" onfocus="this.select()" onchange="window._setDispoVal('${f.id}',this.value)" onblur="window._setDispoVal('${f.id}',this.value)">
        <button class="qty-btn" onclick="window._setDispo('${f.id}',${0},1)">+</button>
      </div>
      ${dq>0?`<div style="font-weight:700;font-size:.85rem;color:var(--accent);min-width:54px;text-align:right">${dSub}€</div>`:'<div style="min-width:54px"></div>'}
    </div>`;
  }).join('');

  const total=flowers.reduce((s,f)=>{
    const vars=getFlowerVariants(f.id);
    if(vars) return s+vars.reduce((vs,v)=>vs+(dispoDate[v.id]||0),0);
    return s+(dispoDate[f.id]||0);
  },0);

  const totalEuros=flowers.reduce((s,f)=>{
    const vars=getFlowerVariants(f.id);
    if(vars) return s+vars.reduce((vs,v)=>vs+(dispoDate[v.id]||0)*f.price,0);
    return s+(dispoDate[f.id]||0)*f.price;
  },0);

  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div>
      <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text2)">Stock estimé ce jour</div>
      <div style="font-family:'DM Serif Display',serif;font-size:1.6rem">${total} <span style="font-size:1rem;color:var(--text2)">tiges</span></div>
      <div style="font-size:.9rem;color:var(--accent);font-weight:600;margin-top:2px">${totalEuros.toFixed(2)} € valeur totale</div>
    </div>
    <button onclick="window._clearDispo()" style="padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:transparent;font-family:inherit;font-size:.78rem;color:var(--text2);cursor:pointer">Tout effacer</button>
  </div>
  <div class="search-bar" style="margin-bottom:10px"><span>🔍</span>
    <input id="dispoSearch" placeholder="Rechercher…" oninput="window._fcd(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="clearDispoSearch" onclick="window._fcdc()" style="display:none;background:none;border:none;cursor:pointer;color:var(--text2)">✕</button>
  </div>
  <div id="dispoList">${rows}</div>`;
}

window._setDispo=function(fid,_unused,d){
  const today=todayKey();
  if(!state.dispo) state.dispo={};
  if(!state.dispo[today]) state.dispo[today]={};
  const cur=state.dispo[today][fid]||0;
  const nv=Math.max(0,cur+d);
  state.dispo[today][fid]=nv;
  scheduleSave();renderMain();
};
window._setDispoVal=function(fid,v){
  const today=todayKey();
  if(!state.dispo) state.dispo={};
  if(!state.dispo[today]) state.dispo[today]={};
  state.dispo[today][fid]=Math.max(0,parseInt(v)||0);
  scheduleSave();
  // update badge inline
  renderMain();
};
window._clearDispo=function(){
  if(confirm('Effacer toutes les quantités dispo du jour ?')){
    const today=todayKey();
    if(state.dispo) state.dispo[today]={};
    scheduleSave();renderMain();
  }
};
window._fcd=function(q){
  const v=q.toLowerCase();
  document.querySelectorAll('#dispoList .dispo-row, #dispoList .dispo-group').forEach(r=>{
    const n=r.querySelector('.dispo-name,.dispo-group-header span:nth-child(2)');
    if(!n)return;
    r.style.display=(!v||n.textContent.toLowerCase().includes(v))?'':'none';
  });
  const b=document.getElementById('clearDispoSearch');if(b)b.style.display=v?'':'none';
};
window._fcdc=function(){const i=document.getElementById('dispoSearch');if(i){i.value='';i.focus();}window._fcd('');};

// ── SUMMARY ───────────────────────────────────────────────────────────
function buildSummary(){
  const allKeys=Object.keys(state.sessions||{}).sort((a,b)=>b.localeCompare(a));
  let html='',hasAny=false;
  allKeys.forEach(dk=>{
    const sessDate=state.sessions[dk]||{};
    const fd=(state.florists||[]).map(c=>{
      const fs=sessDate[c.id]||{quantities:{}};
      const items=harvestItems(fs);
      const total=items.reduce((sum,item)=>sum+item.quantity*item.price,0);
      return{c,items,total};
    }).filter(x=>x.items.length>0);
    if(!fd.length)return;hasAny=true;
    const grand=fd.reduce((s,x)=>s+x.total,0);
    html+=`<div style="margin-bottom:20px">
      <div style="font-family:'DM Serif Display',serif;font-size:1rem;margin-bottom:8px;color:var(--text2)">${formatDateKey(dk)} — <strong style="color:var(--text)">${grand.toFixed(2)} €</strong></div>
      ${fd.map(({c,items,total})=>{const b=c.budget||0,pct=b>0?Math.min((total/b)*100,100):0,bc=total>b?'over':total>b*.85?'warn':'';return`<div class="summary-florist"><div class="sf-name">${c.name}<span class="sf-total">${total.toFixed(2)} €${b>0?' / '+b.toFixed(0)+' €':''}</span></div>${items.map(f=>{const q=f.quantity,p=f.price;return`<div class="sf-row"><span>${f.name} × ${q}${f.modified?' <span style="font-size:.7rem;color:var(--warning)">✎'+p.toFixed(2)+'€</span>':''}</span><span>${(q*p).toFixed(2)} €</span></div>`;}).join('')}${b>0?`<div class="sf-budget-bar"><div class="sf-budget-fill ${bc}" style="width:${pct}%"></div></div>`:''}</div>`;}).join('')}
    </div>`;
  });
  // Commandes terminées
  const cmdTerminees=Object.values(state.commandes||{}).filter(c=>c.statut==='terminee');
  let cmdHtml='';
  if(cmdTerminees.length>0){
    cmdHtml='<div style="margin-top:24px"><div style="font-family:\'DM Serif Display\',serif;font-size:1.1rem;margin-bottom:10px">📋 Commandes terminées</div>';
    cmdTerminees.sort((a,b)=>(b.importDate||'').localeCompare(a.importDate||'')).forEach(c=>{
      const totalE=c.lignes.reduce((s,l)=>{const pt=l.prixTige!=null?l.prixTige:(l.prixBotte?l.prixBotte/10:0);return s+(l.tiges||0)*pt;},0);
      const totalT=c.lignes.reduce((s,l)=>s+(l.tiges||0),0);
      cmdHtml+=`<div class="summary-florist">
        <div class="sf-name">${c.fleuriste||'Sans nom'}<span class="sf-total">${totalE.toFixed(2)} €</span></div>
        <div style="font-size:.75rem;color:var(--text2);margin-bottom:6px">${c.entreprise||''} ${c.numero?'· #'+c.numero:''} · ${totalT} tiges · ${c.importDate}</div>
        ${c.lignes.map(l=>{const pt=l.prixTige!=null?l.prixTige:(l.prixBotte?l.prixBotte/10:0);return `<div class="sf-row"><span>${l.nom} × ${l.tiges||0}t</span><span>${((l.tiges||0)*pt).toFixed(2)} €</span></div>`;}).join('')}
      </div>`;
    });
    cmdHtml+='</div>';
  }

  if(!hasAny && !cmdHtml)return'<div class="empty">Aucune quantité saisie</div>';
  return html+cmdHtml+`<button class="btn-export" onclick="window._share()">📤 Partager la session en cours</button><button class="btn-reset" onclick="window._resetAll()">🗑 Réinitialiser toutes les sessions</button>`;
}

window._share=function(){
  const sessDate=state.sessions[state.activeSession]||{};
  const lines=(state.florists||[]).map(c=>{
    const items=harvestItems(sessDate[c.id]||{});
    if(!items.length)return null;
    const total=items.reduce((sum,f)=>sum+f.quantity*f.price,0);
    return`${c.name}\n${items.map(f=>`  ${f.name} × ${f.quantity} = ${(f.quantity*f.price).toFixed(2)}€`).join('\n')}\nTotal: ${total.toFixed(2)}€`;
  }).filter(Boolean);
  const txt=`Cueillette ${formatDateKey(state.activeSession)}\n\n${lines.join('\n\n')}`;
  if(navigator.share)navigator.share({title:'Cueillette Mojo',text:txt});
  else navigator.clipboard.writeText(txt).then(()=>showToast('Copié !'));
};
window._resetAll=function(){if(confirm('Supprimer toutes les sessions ?')){state.sessions={};scheduleSave();renderMain();}};

// ── CATALOGUE (global, prix et noms) ─────────────────────────────────
function buildCatalog(){
  const sorted=[...(state.flowers||[])].sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  return `<div class="hint">Modifiez les noms et prix — s'applique à tous les fleuristes.<br>Pour choisir quelles fleurs apparaissent par fleuriste, allez dans 🌿 Cueillette → ✓ Sélection.</div>
    <div class="search-bar" style="margin-bottom:10px"><span>🔍</span>
      <input id="catalogSearch" placeholder="Rechercher…" oninput="window._fc(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="clearSearch" onclick="window._fcc()" style="display:none;background:none;border:none;cursor:pointer;color:var(--text2)">✕</button>
    </div>
    <div class="add-row" style="margin-bottom:12px">
      <input id="nfName" placeholder="Nouvelle variété…">
      <input id="nfPrice" type="number" step="0.05" min="0" placeholder="0.00" style="width:75px;padding:9px 8px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:.86rem;background:var(--surface);color:var(--text);-moz-appearance:textfield;appearance:textfield">
      <button class="btn-add" onclick="window._af()">+ Ajouter</button>
    </div>
    <div class="section-title"><span>Catalogue — ${sorted.length} variétés</span></div>
    <div id="catalogList">
      ${sorted.map(f=>{
        const vars=getFlowerVariants(f.id);
        const isOpen=!!(state.expandedGroups||{})['cat_'+f.id];
        const varRows=vars?vars.map(v=>`<div class="catalog-variant-row">
          <span style="color:var(--text2);font-size:.8rem">↳</span>
          <input type="text" value="${v.name}" onchange="window._ev('${f.id}','${v.id}','name',this.value)">
          <button class="del-btn" onclick="window._dv('${f.id}','${v.id}')">✕</button>
        </div>`).join(''):'';
        const addVarRow=isOpen?`<div class="catalog-variant-row">
          <span style="color:var(--text2);font-size:.8rem">+</span>
          <input id="nv_${f.id}" type="text" placeholder="Nouvelle variante (ex: jaune)…" style="flex:1">
          <button onclick="window._av('${f.id}')" style="padding:4px 10px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:.78rem;cursor:pointer">Ajouter</button>
        </div>`:'';
        return `<div class="catalog-row" id="cr_${f.id}">
          <input type="text" value="${f.name}" onchange="window._ef('${f.id}','name',this.value)" style="flex:1">
          <input type="number" step="0.05" min="0" value="${f.price.toFixed(2)}" onchange="window._ef('${f.id}','price',parseFloat(this.value)||0)"> €
          <button onclick="window._toggleGroup('cat_${f.id}')" style="background:none;border:none;cursor:pointer;font-size:.8rem;color:var(--accent);padding:2px 4px" title="Variantes">${vars?vars.length+'🎨':'🎨'}</button>
          <button class="del-btn" onclick="window._df('${f.id}')">✕</button>
        </div>${isOpen?varRows+addVarRow:''}`;
      }).join('')}
    </div>`;
}
window._fc=function(q){const v=q.toLowerCase();document.querySelectorAll('#catalogList .catalog-row').forEach(r=>{const n=r.querySelector('input[type=text]');if(n)r.style.display=(!v||n.value.toLowerCase().includes(v))?'':'none';});const b=document.getElementById('clearSearch');if(b)b.style.display=v?'':'none';};
window._fcc=function(){const i=document.getElementById('catalogSearch');if(i){i.value='';i.focus();}window._fc('');};
window._ef=function(id,k,v){const f=(state.flowers||[]).find(x=>x.id===id);if(f){f[k]=v;scheduleSave();}};
window._ev=function(fid,vid,k,v){const f=(state.flowers||[]).find(x=>x.id===fid);if(f&&f.variants){const vt=f.variants.find(x=>x.id===vid);if(vt){vt[k]=v;scheduleSave();}}};
window._dv=function(fid,vid){const f=(state.flowers||[]).find(x=>x.id===fid);if(f&&f.variants){f.variants=f.variants.filter(v=>v.id!==vid);scheduleSave();renderMain();}};
window._av=function(fid){
  const f=(state.flowers||[]).find(x=>x.id===fid);if(!f)return;
  const inp=document.getElementById('nv_'+fid);if(!inp)return;
  const name=inp.value.trim();if(!name)return;
  if(!f.variants)f.variants=[];
  f.variants.push({id:uid(),name});
  scheduleSave();renderMain();
};
window._df=function(id){if(confirm('Supprimer cette fleur du catalogue ?')){state.flowers=state.flowers.filter(f=>f.id!==id);scheduleSave();renderMain();}};
window._af=function(){const name=document.getElementById('nfName').value.trim();const price=parseFloat(document.getElementById('nfPrice').value)||0;if(!name)return;state.flowers.push({id:uid(),name,price});scheduleSave();renderMain();};

// ── FLEURISTES ────────────────────────────────────────────────────────
function buildFlorists(){
  return `<div class="section-title"><span>${(state.florists||[]).length} fleuriste(s)</span></div>
    ${(state.florists||[]).map(c=>`<div class="florist-mgmt-row"><span>🏪</span>
      <input value="${c.name}" onchange="window._efl('${c.id}','name',this.value)">
      <input style="width:65px;text-align:right;font-weight:600;color:var(--accent);-moz-appearance:textfield;appearance:textfield" type="number" value="${c.budget}" min="0" step="5" onchange="window._efl('${c.id}','budget',parseFloat(this.value)||0)"> €
      <button class="del-btn" onclick="window._dfl('${c.id}')">✕</button>
    </div>`).join('')}
    <div class="add-row" style="margin-top:12px">
      <input id="nflName" placeholder="Nom du fleuriste…">
      <input id="nflBudget" type="number" step="5" min="0" placeholder="100" style="width:75px;padding:9px 8px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:.86rem;background:var(--surface);color:var(--text);-moz-appearance:textfield;appearance:textfield">
      <button class="btn-add" onclick="window._afl()">+ Ajouter</button>
    </div>`;
}
window._efl=function(id,k,v){const c=(state.florists||[]).find(x=>x.id===id);if(c){c[k]=v;scheduleSave();}};
window._dfl=function(id){if((state.florists||[]).length<=1)return alert('Il faut au moins un fleuriste.');if(confirm('Supprimer ce fleuriste ?')){state.florists=state.florists.filter(c=>c.id!==id);if(state.activeFlorist===id)state.activeFlorist=(state.florists[0]||{}).id;scheduleSave();renderMain();}};
window._afl=function(){const name=document.getElementById('nflName').value.trim()||`Fleuriste ${(state.florists||[]).length+1}`;const budget=parseFloat(document.getElementById('nflBudget').value)||100;state.florists.push({id:uid(),name,budget});scheduleSave();renderMain();};

// ── SAUVEGARDE ────────────────────────────────────────────────────────
function buildBackup(){
  return `<div class="save-section"><div class="save-title">☁️ Firebase</div>
    <p style="font-size:.84rem;color:var(--text2);margin-bottom:14px;line-height:1.6">Synchronisation automatique entre tous les téléphones.</p>
    <button class="btn-export" onclick="pushToFirebase();showToast('Synchronisé !')">⟳ Forcer la synchronisation</button></div>
    <div class="save-section"><div class="save-title">💾 Sauvegarde locale</div>
    <p style="font-size:.84rem;color:var(--text2);margin-bottom:14px;line-height:1.6">Copie de secours à garder dans Google Drive.</p>
    <button class="btn-export" onclick="window._exp()">📥 Télécharger .json</button>
    <button class="btn-import" onclick="document.getElementById('importInput').click()">📂 Importer .json</button></div>
    <div class="save-section"><div class="save-title">🔒 Sécurité</div>
    <p style="font-size:.84rem;color:var(--text2);margin-bottom:14px;line-height:1.6">Se déconnecter pour redemander le code PIN.</p>
    <button class="btn-reset" onclick="window._lock()">🔒 Se déconnecter</button></div>
    <div class="save-section"><div class="save-title">⚠️ Réinitialisation</div>
    <button class="btn-reset" onclick="window._hard()">Réinitialiser complètement</button></div>`;
}
window._exp=function(){const blob=new Blob([JSON.stringify({flowers:state.flowers,florists:state.florists,sessions:state.sessions,dispo:state.dispo||{},commandes:state.commandes||{},sechees:state.sechees||[],seaux:state.seaux||{stock:{procona:0,petit:0,carre:0},mouvements:[]}},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`mojo-${todayKey()}.json`;a.click();URL.revokeObjectURL(url);showToast('Téléchargé !');};
window._importJSON=function(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const imp=JSON.parse(e.target.result);if(!imp.flowers||!imp.florists)throw new Error();if(confirm('Importer et écraser Firebase ?')){state.flowers=imp.flowers;state.florists=imp.florists;state.sessions=imp.sessions||{};pushToFirebase();renderMain();showToast('Importé !');}}catch(e){alert('Fichier invalide.');}};reader.readAsText(file);input.value='';};
window._lock=function(){localStorage.removeItem('mojo_auth');document.getElementById('lockScreen').style.display='flex';};
window._hard=function(){if(confirm('⚠️ Tout effacer y compris Firebase ?')){const s=defaultState();state.flowers=s.flowers;state.florists=s.florists;state.sessions={};pushToFirebase();renderMain();showToast('Réinitialisé');}};
window.pushToFirebase=pushToFirebase;
window.showToast=showToast;

// ── RENDER ────────────────────────────────────────────────────────────
let _appRendered=false;
function renderMain(){
  _appRendered=true;
  renderTabs();
  const m=document.getElementById('mainContent');
  const builders={harvest:buildHarvest,commandes:buildCommandes,seaux:buildSeaux,dispo:buildDispo,summary:buildSummary,catalog:buildCatalog,florists:buildFlorists,backup:buildBackup};
  try{const page=APP_PAGES[state.activeTab]||APP_PAGES.harvest;m.innerHTML=`<div class="page-heading"><div class="page-eyebrow">Mojo · Ferme florale</div><h1>${page[0]}</h1><p>${page[1]}</p></div>`+(builders[state.activeTab]||buildHarvest)();}
  catch(e){console.error('Render error',e);m.innerHTML=`<div class="empty">Erreur d'affichage</div>`;}
}
window.renderMain=renderMain;
</script>
</body>
</html>
